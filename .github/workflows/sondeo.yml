name: Sondeo impresora (prueba)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node sondeo.mjs
        env:
          BAMBU_TOKEN: ${{ secrets.BAMBU_TOKEN }}
