name: Prueba bloqueo Bambu
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          u="https://api.bambulab.com/v1/user-service/my/tasks?limit=1"
          echo "curl-bbl $(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: bambu_network_agent/01.09.05.01' -H 'X-BBL-Client-Name: OrcaSlicer' -H 'X-BBL-Client-Type: slicer' -H 'X-BBL-Client-Version: 01.09.05.51' -H 'X-BBL-Language: es-ES' -H 'accept: application/json' "$u")"
          echo "curl-token $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" -H 'User-Agent: bambu_network_agent/01.09.05.01' "$u")"
          echo "curl-token-bbl $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" -H 'User-Agent: bambu_network_agent/01.09.05.01' -H 'X-BBL-Client-Name: OrcaSlicer' -H 'X-BBL-Client-Type: slicer' -H 'X-BBL-Client-Version: 01.09.05.51' -H 'X-BBL-Language: es-ES' -H 'accept: application/json' "$u")"
          node -e '
          const u="https://api.bambulab.com/v1/user-service/my/tasks?limit=1";
          const H={"User-Agent":"bambu_network_agent/01.09.05.01"};
          (async()=>{
            console.log("node-sin", (await fetch(u,{headers:H})).status);
            console.log("node-token", (await fetch(u,{headers:{...H,Authorization:"Bearer "+process.env.T}})).status);
          })()'
        env:
          T: ${{ secrets.BAMBU_TOKEN }}
