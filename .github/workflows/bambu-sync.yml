name: Bambu → Arde3D

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bambu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node sync.mjs
        env:
          BAMBU_TOKEN: ${{ secrets.BAMBU_TOKEN }}
      # GitHub pausa las tareas programadas tras 60 días sin actividad; esto la mantiene activa
      - name: Mantener activa
        if: always()
        run: gh workflow enable bambu-sync.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
